<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>RENANck Hub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #ffffff;
      font-family: Arial, sans-serif;
      padding: 30px;
      overflow-x: hidden;
    }

    .hub {
      width: 100%;
      min-height: calc(100vh - 60px);

      display: grid;
      grid-template-columns: 38% 1fr;
      grid-template-rows: 38vh 1fr;
      column-gap: 45px;
      row-gap: 55px;
    }

    .box {
      background: white;
      border: 3px dashed #000;
      overflow: hidden;
      position: relative;
    }

    .box iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: white;
    }

    .titulo {
      position: absolute;
      top: 8px;
      left: 10px;
      z-index: 2;
      background: rgba(255,255,255,0.9);
      padding: 4px 8px;
      font-size: 13px;
      font-weight: bold;
      color: #000;
      border: 1px solid #000;
    }

    /* QUADRADO/RETÂNGULO GRANDE DA ESQUERDA */
    .youtube {
      grid-column: 1;
      grid-row: 1 / 3;
      min-height: 88vh;
    }

    /* RETÂNGULO GRANDE DO TOPO DIREITO */
    .medicina {
      grid-column: 2;
      grid-row: 1;
      width: 100%;
      height: 100%;
    }

    /* QUADRADO PEQUENO DO TIMER */
    .timer-wrapper {
      grid-column: 2;
      grid-row: 2;

      display: flex;
      justify-content: center;
      align-items: start;
      padding-top: 12vh;
    }

    .timer {
      width: 45%;
      aspect-ratio: 1 / 1;
      min-width: 230px;
      max-width: 340px;
    }

    @media (max-width: 900px) {
      body {
        padding: 15px;
      }

      .hub {
        display: flex;
        flex-direction: column;
        gap: 25px;
      }

      .youtube {
        min-height: 700px;
      }

      .medicina {
        height: 380px;
      }

      .timer-wrapper {
        padding-top: 0;
      }

      .timer {
        width: 100%;
        max-width: none;
        min-width: 0;
        height: 320px;
        aspect-ratio: auto;
      }
    }
  </style>
</head>

<body>

  <main class="hub">

    <section class="box youtube">
      <div class="titulo">YOUTUBE MÚSICA</div>
      <iframe src="https://renanck.github.io/youtubemusica/index.html"></iframe>
    </section>

    <section class="box medicina">
      <div class="titulo">MEDICINA</div>
      <iframe src="https://renanck.github.io/medicina/index.html"></iframe>
    </section>

    <div class="timer-wrapper">
      <section class="box timer">
        <div class="titulo">TIMER</div>
        <iframe src="https://renanck.github.io/timer/"></iframe>
      </section>
    </div>

  </main>

</body>
</html>
