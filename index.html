<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>RENANck Hub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #b868d8;
      font-family: Arial, sans-serif;
      padding: 28px;
      overflow-x: hidden;
    }

    .hub {
      width: min(1300px, 100%);
      min-height: calc(100vh - 56px);
      margin: 0 auto;

      display: grid;
      grid-template-columns: 0.95fr 1.05fr;
      grid-template-rows: 44% 56%;
      gap: 26px 48px;
    }

    .box {
      background: #ececec;
      border: 4px dashed #000;
      overflow: hidden;
      position: relative;
    }

    .box iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #ececec;
    }

    .titulo {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(34px, 2vw, 44px);
      letter-spacing: 1px;
      color: #111;
      pointer-events: none;
      text-transform: uppercase;
      background: transparent;
    }

    .timer {
      grid-column: 1;
      grid-row: 1;
    }

    .youtube {
      grid-column: 1;
      grid-row: 2;
    }

    .medicina {
      grid-column: 2;
      grid-row: 1 / 3;
    }

    @media (max-width: 900px) {
      body {
        padding: 16px;
      }

      .hub {
        min-height: auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .timer,
      .youtube,
      .medicina {
        min-height: 300px;
      }

      .titulo {
        font-size: clamp(28px, 7vw, 40px);
      }
    }
  </style>
</head>

<body>

  <main class="hub">

    <section class="box timer">
      <div class="titulo">TIMER</div>
      <iframe src="https://renanck.github.io/timer/"></iframe>
    </section>

    <section class="box youtube">
      <div class="titulo">MUSIC</div>
      <iframe src="https://renanck.github.io/youtubemusica/index.html"></iframe>
    </section>

    <section class="box medicina">
      <div class="titulo">QUESTÕES</div>
      <iframe src="https://renanck.github.io/medicina/index.html"></iframe>
    </section>

  </main>

</body>
</html>
