<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>RENANck Hub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #b868d8;
      font-family: Arial, sans-serif;
      padding: 28px;
      overflow-x: hidden;
    }

    .hub {
      width: min(1300px, 100%);
      min-height: calc(100vh - 56px);
      margin: 0 auto;

      display: grid;
      grid-template-columns: 0.95fr 1.05fr;
      grid-template-rows: 44% 56%;
      gap: 26px 48px;
    }

    .box {
      background: #ececec;
      border: 4px dashed #000;
      overflow: hidden;
      position: relative;
    }

    .box iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #ececec;
    }

    .titulo {
      position: absolute;
      top: 12px;
      left: 14px;
      z-index: 3;
      font-size: clamp(20px, 1.3vw, 26px);
      letter-spacing: 1px;
      color: #111;
      pointer-events: none;
      text-transform: uppercase;
      background: rgba(236, 236, 236, 0.85);
      padding: 4px 10px;
      border-radius: 8px;
    }

    .split-area {
      height: 100%;
      display: grid;
      grid-template-columns: 1fr 240px;
      gap: 10px;
      padding: 8px;
    }

    .mini-box {
      border: 3px dashed #111;
      background: #fff;
      overflow: hidden;
      border-radius: 12px;
      position: relative;
    }

    .mini-box iframe {
      border-radius: 8px;
    }

    .mini-title {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 3;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.5px;
      background: rgba(255, 255, 255, 0.9);
      padding: 3px 6px;
      border-radius: 6px;
      text-transform: uppercase;
      pointer-events: none;
    }

    .timer {
      grid-column: 1;
      grid-row: 1;
    }

    .youtube {
      grid-column: 1;
      grid-row: 2;
    }

    .medicina {
      grid-column: 2;
      grid-row: 1 / 3;
    }

    @media (max-width: 900px) {
      body {
        padding: 16px;
      }

      .hub {
        min-height: auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .timer,
      .youtube,
      .medicina {
        min-height: 300px;
      }

      .split-area {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(260px, 1fr) minmax(220px, 260px);
      }
    }
  </style>
</head>

<body>

  <main class="hub">

    <section class="box timer">
      <div class="titulo">TIMER</div>
      <div class="split-area">
        <iframe src="https://renanck.github.io/timer/"></iframe>
        <div class="mini-box">
          <div class="mini-title">Cronômetro</div>
          <iframe src="cronometro.html"></iframe>
        </div>
      </div>
    </section>

    <section class="box youtube">
      <div class="titulo">MUSIC</div>
      <iframe src="https://renanck.github.io/youtubemusica/index.html"></iframe>
    </section>

    <section class="box medicina">
      <div class="titulo">QUESTÕES</div>
      <div class="split-area">
        <iframe src="https://renanck.github.io/medicina/index.html"></iframe>
        <div class="mini-box">
          <div class="mini-title">Contador</div>
          <iframe src="contador.html"></iframe>
        </div>
      </div>
    </section>

  </main>

</body>
</html>
