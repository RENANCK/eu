<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>RENANck Hub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      padding: 24px;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 15% 15%, rgba(255, 255, 255, 0.35), transparent 28%),
        radial-gradient(circle at 85% 20%, rgba(255, 140, 230, 0.35), transparent 30%),
        linear-gradient(135deg, #8d46d9 0%, #c76be8 48%, #f3b6ff 100%);
      color: #111;
    }

    .hub {
      width: min(1450px, 100%);
      height: calc(100vh - 48px);
      min-height: 720px;
      margin: 0 auto;

      display: grid;
      grid-template-columns: minmax(560px, 1.35fr) minmax(340px, 0.85fr);
      grid-template-rows: minmax(360px, 0.58fr) minmax(280px, 0.42fr);
      gap: 24px;
    }

    .card {
      position: relative;
      overflow: hidden;
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.72);
      border: 2px solid rgba(255, 255, 255, 0.75);
      box-shadow:
        0 28px 80px rgba(58, 17, 90, 0.28),
        inset 0 0 0 1px rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(18px);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      border-radius: inherit;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.48), transparent 32%),
        linear-gradient(135deg, rgba(255, 255, 255, 0.24), transparent 45%);
    }

    .card-header {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 4;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .title-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .label {
      width: fit-content;
      padding: 8px 13px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.08);

      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1.6px;
      text-transform: uppercase;
    }

    .subtitle {
      margin-left: 6px;
      font-size: 12px;
      font-weight: 700;
      opacity: 0.65;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .open-link {
      pointer-events: auto;
      text-decoration: none;
      color: #111;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 999px;
      padding: 9px 13px;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.08);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .open-link:hover {
      transform: translateY(-2px);
      background: #fff;
    }

    .frame {
      position: absolute;
      inset: 0;
      z-index: 2;
      padding-top: 0;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #f2f2f2;
    }

    .music {
      grid-column: 1;
      grid-row: 1 / 3;
    }

    .medicina {
      grid-column: 2;
      grid-row: 1;
    }

    .timer {
      grid-column: 2;
      grid-row: 2;
    }

    .music .label {
      font-size: clamp(13px, 1vw, 16px);
    }

    .music .subtitle {
      font-size: 13px;
    }

    .medicina .label,
    .timer .label {
      font-size: 12px;
    }

    .contador-flutuante {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 99;

      width: 150px;
      padding: 16px;
      border-radius: 24px;

      background: rgba(255, 255, 255, 0.88);
      border: 2px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 18px 45px rgba(40, 10, 70, 0.28);
      backdrop-filter: blur(16px);

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .contador-titulo {
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }

    #contadorNumero {
      font-size: 44px;
      font-weight: 900;
      line-height: 1;
    }

    .contador-flutuante button {
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 10px 12px;

      background: #111;
      color: #fff;

      font-size: 15px;
      font-weight: 900;
      cursor: pointer;

      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .contador-flutuante button:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .contador-flutuante .reset-contador {
      background: #7c52d9;
      font-size: 12px;
      padding: 8px 10px;
    }

    @media (max-width: 1050px) {
      body {
        padding: 16px;
      }

      .hub {
        height: auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .card {
        border-radius: 26px;
      }

      .music {
        height: 72vh;
        min-height: 520px;
      }

      .medicina {
        height: 56vh;
        min-height: 430px;
      }

      .timer {
        height: 46vh;
        min-height: 340px;
      }
    }

    @media (max-width: 650px) {
      body {
        padding: 10px;
      }

      .hub {
        gap: 12px;
      }

      .card {
        border-radius: 22px;
      }

      .card-header {
        top: 10px;
        left: 10px;
        right: 10px;
      }

      .label {
        padding: 7px 10px;
        font-size: 10px;
        letter-spacing: 1px;
      }

      .subtitle {
        display: none;
      }

      .open-link {
        padding: 7px 10px;
        font-size: 10px;
      }

      .music {
        height: 68vh;
        min-height: 470px;
      }

      .medicina {
        height: 58vh;
        min-height: 420px;
      }

      .timer {
        height: 42vh;
        min-height: 310px;
      }

      .contador-flutuante {
        right: 12px;
        bottom: 12px;
        width: 126px;
        padding: 12px;
        border-radius: 20px;
      }

      #contadorNumero {
        font-size: 34px;
      }

      .contador-flutuante button {
        padding: 8px 10px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <main class="hub">

    <section class="card music">
      <div class="card-header">
        <div class="title-group">
          <div class="label">Music</div>
          <div class="subtitle">player principal</div>
        </div>

        <a
          class="open-link"
          href="https://renanck.github.io/youtubemusica/index.html"
          target="_blank"
        >
          Abrir
        </a>
      </div>

      <div class="frame">
        <iframe
          src="https://renanck.github.io/youtubemusica/index.html"
          title="RENANck Music"
          loading="lazy">
        </iframe>
      </div>
    </section>

    <section class="card medicina">
      <div class="card-header">
        <div class="title-group">
          <div class="label">Questões</div>
          <div class="subtitle">medicina</div>
        </div>

        <a
          class="open-link"
          href="https://renanck.github.io/medicina/index.html"
          target="_blank"
        >
          Abrir
        </a>
      </div>

      <div class="frame">
        <iframe
          src="https://renanck.github.io/medicina/index.html"
          title="Hiperfoco em Medicina"
          loading="lazy">
        </iframe>
      </div>
    </section>

    <section class="card timer">
      <div class="card-header">
        <div class="title-group">
          <div class="label">Timer</div>
          <div class="subtitle">cronômetro</div>
        </div>

        <a
          class="open-link"
          href="https://renanck.github.io/timer/"
          target="_blank"
        >
          Abrir
        </a>
      </div>

      <div class="frame">
        <iframe
          src="https://renanck.github.io/timer/"
          title="Timer"
          loading="lazy">
        </iframe>
      </div>
    </section>

  </main>

  <div class="contador-flutuante">
    <div class="contador-titulo">Contador</div>
    <div id="contadorNumero">0</div>

    <button onclick="aumentarContador()">+1</button>
    <button class="reset-contador" onclick="resetarContador()">Resetar</button>
  </div>

  <script>
    let contador = Number(localStorage.getItem("contadorRENANck")) || 0;

    const contadorNumero = document.getElementById("contadorNumero");
    contadorNumero.textContent = contador;

    function aumentarContador() {
      contador++;
      contadorNumero.textContent = contador;
      localStorage.setItem("contadorRENANck", contador);
    }

    function resetarContador() {
      contador = 0;
      contadorNumero.textContent = contador;
      localStorage.setItem("contadorRENANck", contador);
    }
  </script>

</body>
</html>
