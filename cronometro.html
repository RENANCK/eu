<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cronômetro</title>
  <style>
    body { margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; background: #f5f5f5; font-family: Arial, sans-serif; }
    .container { background: #fff; padding: 18px; border-radius: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.12); text-align: center; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; }
    h1 { margin: 0 0 10px; font-size: 16px; }
    #tempo { font-size: 28px; font-weight: 700; margin: 10px 0; letter-spacing: 1px; }
    button { padding: 6px 10px; margin: 3px; border: none; border-radius: 8px; font-size: 12px; cursor: pointer; background: #111; color: #fff; }
    .reset { background: #777; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Cronômetro</h1>
    <div id="tempo">00:00:00</div>
    <div>
      <button onclick="iniciar()">Iniciar</button>
      <button onclick="pausar()">Pausar</button>
      <button class="reset" onclick="resetar()">Resetar</button>
    </div>
  </div>
  <script>
    let segundos = 0;
    let intervalo = null;
    function atualizarTela() {
      const horas = Math.floor(segundos / 3600);
      const minutos = Math.floor((segundos % 3600) / 60);
      const segs = segundos % 60;
      document.getElementById('tempo').textContent = `${String(horas).padStart(2, '0')}:${String(minutos).padStart(2, '0')}:${String(segs).padStart(2, '0')}`;
    }
    function iniciar() {
      if (intervalo !== null) return;
      intervalo = setInterval(() => {
        segundos++;
        atualizarTela();
      }, 1000);
    }
    function pausar() { clearInterval(intervalo); intervalo = null; }
    function resetar() { pausar(); segundos = 0; atualizarTela(); }
  </script>
</body>
</html>
