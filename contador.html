<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contador</title>
  <style>
    body { margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; background: #f5f5f5; font-family: Arial, sans-serif; }
    .container { background: #fff; padding: 18px; border-radius: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.12); text-align: center; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; }
    h1 { margin: 0 0 10px; font-size: 16px; }
    #contador { font-size: 42px; font-weight: 700; margin: 10px 0; }
    button { padding: 8px 12px; border: none; border-radius: 8px; font-size: 13px; cursor: pointer; background: #111; color: #fff; }
    .reset { margin-top: 8px; background: #777; font-size: 12px; padding: 6px 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Contador</h1>
    <div id="contador">0</div>
    <button onclick="aumentar()">Clique aqui</button>
    <button class="reset" onclick="resetar()">Resetar</button>
  </div>
  <script>
    let numero = 0;
    function aumentar() { numero++; document.getElementById('contador').textContent = numero; }
    function resetar() { numero = 0; document.getElementById('contador').textContent = numero; }
  </script>
</body>
</html>
